#clr{

  width:28px;height:28px;border:0;border-radius:50%;background:#eceff3;color:#6b7280;

.chips{display:flex;gap:7px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}

}
.chip.on{background:#0f766e;border-color:#0f766e;color:#fff;font-weight:600}
.meta{

  padding:9px 16px 7px;font-size:12px;color:#818a96;
}
.meta b{color:#0f766e;font-weight:600}
main{padding:0 10px 40px}
ul{list-style:none;margin:0;padding:0}
.item{background:#fff;border:1px solid #e8ebef;border-radius:12px;margin-bottom:8px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer}
.main{min-width:0;flex:1}
.name{font-size:15px;font-weight:600;color:#151a21;word-break:break-word}
.path{font-size:12px;color:#8a919d;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code{

  padding:3px 7px;border-radius:6px;flex:0 0 auto;letter-spacing:.3px;
}
.detail{display:none;border-top:1px dashed #e8ebef;padding:10px 13px 13px;background:#fbfcfd}
.item.open .detail{display:block}
dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:0 0 10px;font-size:12.5px}
dt{color:#8a919d}
dd{margin:0;color:#2b323c;word-break:break-all}
.copy{
  width:100%;height:36px;border:1px solid #0f766e;border-radius:9px;background:#0f766e;color:#fff;
  font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;
}
.copy:active{opacity:.85}
mark{background:#fff1a8;color:inherit;padding:0 1px;border-radius:2px}
#empty{display:none;text-align:center;color:#9aa2ad;font-size:13.5px;padding:48px 20px}
#sentinel{height:1px}
#toast{

  font-size:13px;padding:9px 16px;border-radius:99px;opacity:0;pointer-events:none;

}
#toast.on{opacity:.94;transform:translate(-50%,0)}

  const b=document.createElement('button');
  b.className='chip';b.textContent=c;b.dataset.cat=c;
  b.onclick=()=>{curCat=(curCat===c?'':c);syncChips();apply();};
  chipsEl.appendChild(b);
});
function syncChips(){
  chipsEl.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.dataset.cat===curCat));
  chipsEl.querySelectorAll('.chip').forEach(x=>{if(x.dataset.cat===curCat)x.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'})});
}

/* 搜索 */
let timer;
qEl.addEventListener('input',()=>{
  clrEl.classList.toggle('on',!!qEl.value);
  clearTimeout(timer);timer=setTimeout(apply,90);
});
clrEl.onclick=()=>{qEl.value='';clrEl.classList.remove('on');apply();qEl.focus();};

function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function hl(s){
  let out=esc(s);
  tokens.forEach(t=>{
    if(!t)return;
    const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    out=out.replace(re,'<mark>$1</mark>');
  });
  return out;
}

function apply(){
  tokens=qEl.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  filtered=ITEMS.filter(it=>{
    if(curCat && it.p[0]!==curCat)return false;
    for(const t of tokens){ if(it.key.indexOf(t)<0) return false; }
    return true;
  });
  shown=0;openIdx=-1;listEl.innerHTML='';
  cntEl.innerHTML = (tokens.length||curCat)
     ? '命中 <b>'+filtered.length+'</b> 项'
     : '共 <b>'+ITEMS.length+'</b> 项，按编码排序';
  emptyEl.style.display = filtered.length? 'none':'block';
  render();
  window.scrollTo({top:0,behavior:'instant'in window?'instant':'auto'});
}

const STEP=70;
function render(){
  const end=Math.min(shown+STEP,filtered.length);
  let buf='';
  for(let k=shown;k<end;k++){
    const it=filtered[k];
    buf+='<li class="item" data-i="'+it.i+'"><div class="row">'
      +'<div class="main"><div class="name">'+hl(it.n)+'</div>'
      +'<div class="path">'+hl(it.path)+'</div></div>'
      +'<div class="code">'+hl(it.c)+'</div></div>'
      +'<div class="detail"><dl>'
      +'<dt>类别编码</dt><dd>'+esc(it.c)+'</dd>'
      +'<dt>类别名称</dt><dd>'+esc(it.n)+'</dd>'
      +'<dt>分类路径</dt><dd>'+esc(it.p.join(' / '))+'</dd>'
      +(it.u?'<dt>计量单位</dt><dd>'+esc(it.u)+'</dd>':'')
      +'<dt>使用年限</dt><dd>'+years(it.m)+'</dd>'
      +(it.d&&it.d!=='*'?'<dt>年折旧率</dt><dd>'+esc(it.d)+'%</dd>':'')
      +(it.a?'<dt>科目</dt><dd>'+esc(it.a)+'</dd>':'')
      +'</dl><button class="copy" data-code="'+esc(it.c)+'">复制编码</button></div></li>';
  }
  listEl.insertAdjacentHTML('beforeend',buf);
  shown=end;
}
function years(m){
  const n=parseInt(m,10);
  if(!n||n>=900)return '—';
  const y=n/12;
  return (Number.isInteger(y)? y : y.toFixed(1))+' 年（'+n+' 个月）';
}

/* 展开 / 复制 */
listEl.addEventListener('click',e=>{
  const btn=e.target.closest('.copy');
  if(btn){ copy(btn.dataset.code); return; }
  const li=e.target.closest('.item');
  if(!li)return;
  if(openIdx>=0 && openIdx!==+li.dataset.i){
    const prev=listEl.querySelector('.item[data-i="'+openIdx+'"]');
    if(prev)prev.classList.remove('open');
  }
  li.classList.toggle('open');
  openIdx=li.classList.contains('open')? +li.dataset.i : -1;
});

function copy(txt){
  const done=()=>{toastEl.textContent='已复制 '+txt;toastEl.classList.add('on');setTimeout(()=>toastEl.classList.remove('on'),1300);};
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallback(txt,done));
  }else fallback(txt,done);
}
function fallback(txt,done){
  const ta=document.createElement('textarea');
  ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');done();}catch(e){alert(txt);}
  document.body.removeChild(ta);
}

/* 滚动加载 */
new IntersectionObserver(es=>{
  if(es[0].isIntersecting && shown<filtered.length) render();
},{rootMargin:'320px'}).observe(sentinel);

apply();
</script>
</body>
</html>
